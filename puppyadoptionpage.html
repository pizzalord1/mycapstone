<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="buttons.css">
</head>
<body>
    <h1>Puppy Adoption Page</h1>
    <p><b>Please enter your information to adopt a puppy and we'll email you back.</b></p>
    <p>Please Note: First Name, Last Name, Password, and Email are required</p>
    <br>
    <form method="get" action="index.html">
        <label for="firstname">First name:</label>
        <input type="text" id="firstname" name="firstname" placeholder="First name" required>
        <label for="lastname">Last name:</label>
        <input type="text" id="lastname" name="lastname" placeholder="Last name" required>
        <br>
        <label for="useremail">Email:</label>
        <input type="email" id="useremail" name="useremail" placeholder="example@email.com" required>
        <label for="userpass">Password:</label>
        <input type="password" id="userpass" name="userpass" placeholder="Password" required>
        <br>
        <p><b>Are you over 18?</b></p>
        <br>
        <input type="radio" id="yes" name="age" value="yes">
        <label for="yes">yes</label>
        <input type="radio" id="no" name="age" value="no">
        <label for="no">no</label>
        <br>
        <br>
        <br>
        <label for="usermood">Do you have a Credit Card or PayPal?</label>
        <select id="usermood" name="usermood">
            <option value="paypal">PayPal</option>
            <option value="credit-card">Credit Card</option>
        </select>
        <br>
        <input type="submit" value="Submit feedback">
    </form>
    <a class="buttons" href="index.html">Back to index page</a>
</body>
</html>
