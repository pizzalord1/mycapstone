<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Puppy Adoption Page</h1>
    <p><b>Please enter your information to adopt a puppy and we'll email you back.</b></p>
    <p>Please Note: First Name, Last Name, Password, and Email are required</p>
    <br>
    <form method="get" action="index.html">
        <label for="useremail">First name:</label>
        <input type="name" id="name" name="name" placeholder="first name">
        <label for="userpass">Last Name:</label>
        <input type="Name" id="Name" name="Name" placeholder="Last name">
        <br>
     <form method="get" action="index.html">
     <label for="useremail">Email:</label>
     <input type="email" id="useremail" name="useremail" placeholder="example@email.com">
     <label for="userpass">Password:</label>
     <input type="password" id="userpass" name="userpass" placeholder="password">
        <br>
        <p><b>Are you over 18?</b></p>
        <br>
        <input type="radio" id="yes" name="age" value="yes">
        <label for="yes">yes</label>
        <input type="radio" id="no" name="age" value="no">
        <label for="no">no</label>
        <br>
        <br>
        <br>
        <label for="usermood">Do you have a Credit Card or PayPal?</label>
        <select id="usermood" name="usermood">
            <option value="Choice0">PayPal</option> 
            <option value="Choice1"  >Credit Card</option>
        </select>
        <br>
        <input type="submit" value="Submit feedback">
        <br>
        <a href="index.html">Back to index page</a>
</body>
</html>
